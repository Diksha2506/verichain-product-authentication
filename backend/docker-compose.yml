version: '3.8'

services:
  db:
    image: postgres:15
    container_name: verichain-db
    environment:
      POSTGRES_USER: verichain
      POSTGRES_PASSWORD: verichain_dev_password
      POSTGRES_DB: verichain
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
